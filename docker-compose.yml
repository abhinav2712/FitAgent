services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitagent
      POSTGRES_PASSWORD: fitagent
      POSTGRES_DB: fitagent
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitagent"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: .
    restart: unless-stopped
    command: python -m worker.scheduler
    env_file: .env
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
